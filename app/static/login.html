<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trivy GUI – Login</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="favicon.svg" alt="" width="22" height="22">
      <span>Trivy GUI</span>
    </div>
    <div class="topbar-right">
      <div class="lang-switch" role="group" aria-label="Sprache / Language">
        <button type="button" data-lang="de">DE</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <main class="login-wrap">
    <form id="login-form" class="card login-card" novalidate>
      <img src="favicon.svg" alt="" width="40" height="40" class="login-logo">
      <h1 data-i18n="title"></h1>
      <p class="muted small" data-i18n="subtitle"></p>

      <label class="field">
        <span data-i18n="user"></span>
        <input id="user" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required>
      </label>
      <label class="field">
        <span data-i18n="password"></span>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>

      <button type="submit" class="btn primary" id="login-btn" data-i18n="submit"></button>
      <p id="login-error" class="error" role="alert" hidden></p>
    </form>
  </main>

  <script src="login.js"></script>
</body>
</html>
