services:
  trivy-gui:
    # Fertiges Image aus der CI. "docker compose up -d --build" baut stattdessen lokal.
    image: ghcr.io/db-infra-ops/trivy-gui:latest
    build:
      context: .
    container_name: trivy-gui
    ports:
      # Nur lokal erreichbar. Fuer Zugriff aus dem Netz "127.0.0.1:" entfernen
      # und unbedingt die Anmeldung aktivieren (AUTH_PASSWORD, siehe unten).
      - "127.0.0.1:8080:8080"
    environment:
      MAX_PARALLEL_SCANS: "1"
      SCAN_TIMEOUT: "15m"
      # Login aktivieren: die beiden Zeilen einkommentieren und das Passwort aendern.
      # AUTH_USER: admin                # oder per Variable: ${TRIVY_GUI_USER}
      # AUTH_PASSWORD: Str0ng-Passw0rd  # unbedingt aendern! oder per Variable: ${TRIVY_GUI_PASSWORD}
      # Zugangsdaten fuer private Registries (alternativ docker config mounten):
      # TRIVY_USERNAME: ""
      # TRIVY_PASSWORD: ""
    volumes:
      # Zugriff auf lokale Images. Achtung: ":ro" schraenkt die Docker-API NICHT ein.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - trivy-gui-data:/data
      - trivy-cache:/cache
    restart: unless-stopped

volumes:
  trivy-gui-data:
  trivy-cache:
